<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="localmem-mcp — give your AI agent a memory that never leaves your machine">
  <title>localmem-mcp</title>
  <desc>Local-first memory for AI agents: SQLite, on-device embeddings, no cloud and no API keys.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141310"/>
      <stop offset="0.55" stop-color="#1a1815"/>
      <stop offset="1" stop-color="#12110f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8552f"/>
      <stop offset="1" stop-color="#e5a077"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9622f"/>
      <stop offset="1" stop-color="#8f421f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8552f"/>
      <stop offset="0.45" stop-color="#e08a63" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e08a63" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e08a63" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e08a63" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f5f2ea" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="420" rx="18" fill="url(#dots)"/>
  <ellipse cx="1030" cy="196" rx="380" ry="280" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="17.25" fill="none" stroke="#312f2a"/>

  <!-- wordmark block -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="120" font-size="14" font-weight="600" letter-spacing="3.4" fill="#9b978d">MCP SERVER · PYTHON LIBRARY</text>
    <text x="72" y="196" font-size="66" font-weight="700" letter-spacing="-1.8" fill="#f5f2ea">localmem-mcp</text>
    <rect x="74" y="214" width="196" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="72" y="262" font-size="23" font-weight="500" fill="#cbc5b8">Give your AI agent a memory that never leaves your machine.</text>
    <text x="72" y="294" font-size="18" fill="#8e8a80">No cloud. No API keys. No per-call billing.</text>
  </g>

  <!-- capability chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <g>
      <rect x="72" y="326" width="151" height="38" rx="19" fill="#1e1c19" stroke="#35332d"/>
      <circle cx="93" cy="345" r="3.5" fill="#e08a63"/>
      <text x="106" y="350" fill="#d5cfc2">SQLite + FTS5</text>
    </g>
    <g>
      <rect x="237" y="326" width="206" height="38" rx="19" fill="#1e1c19" stroke="#35332d"/>
      <circle cx="258" cy="345" r="3.5" fill="#e08a63"/>
      <text x="271" y="350" fill="#d5cfc2">on-device embeddings</text>
    </g>
    <g>
      <rect x="457" y="326" width="144" height="38" rx="19" fill="#1e1c19" stroke="#35332d"/>
      <circle cx="478" cy="345" r="3.5" fill="#e08a63"/>
      <text x="491" y="350" fill="#d5cfc2">100% offline</text>
    </g>
  </g>

  <!-- device card: one file on your own disk -->
  <g>
    <rect x="848" y="96" width="360" height="228" rx="18" fill="#191714" stroke="#332f29"/>
    <circle cx="874" cy="127" r="4" fill="#3d3931"/>
    <circle cx="890" cy="127" r="4" fill="#3d3931"/>
    <circle cx="906" cy="127" r="4" fill="#3d3931"/>
    <text x="926" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7c786f">~/.localmem/memories.db</text>
    <line x1="848" y1="152" x2="1208" y2="152" stroke="#282520"/>

    <!-- the single SQLite file -->
    <g>
      <path d="M874 192 v58 a42 13 0 0 0 84 0 v-58 z" fill="url(#cyl)"/>
      <ellipse cx="916" cy="192" rx="42" ry="13" fill="#e5a077"/>
      <ellipse cx="916" cy="221" rx="42" ry="13" fill="none" stroke="#f5f2ea" stroke-opacity="0.18"/>
      <ellipse cx="916" cy="240" rx="42" ry="13" fill="none" stroke="#f5f2ea" stroke-opacity="0.12"/>
    </g>

    <!-- search hits, scored -->
    <g>
      <rect x="986" y="179" width="198" height="14" rx="7" fill="#242119"/>
      <rect x="986" y="179" width="164" height="14" rx="7" fill="url(#accent)"/>
      <rect x="986" y="207" width="198" height="14" rx="7" fill="#242119"/>
      <rect x="986" y="207" width="118" height="14" rx="7" fill="url(#accent)" opacity="0.78"/>
      <rect x="986" y="235" width="198" height="14" rx="7" fill="#242119"/>
      <rect x="986" y="235" width="76" height="14" rx="7" fill="url(#accent)" opacity="0.56"/>
    </g>

    <!-- offline seal -->
    <g>
      <path d="M874 292 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#8e8a80" stroke-width="2"/>
      <rect x="871" y="292" width="18" height="13" rx="3" fill="#8e8a80"/>
      <text x="899" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7c786f">nothing leaves this machine</text>
    </g>
  </g>

  <rect x="72" y="392" width="1136" height="2" rx="1" fill="url(#rule)" opacity="0.5"/>
</svg>
