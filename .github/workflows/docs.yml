name: docs

# Builds the MkDocs site on every PR, and deploys it to GitHub Pages on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The package itself is needed: mkdocstrings imports it to generate the
        # API reference from docstrings.
        run: python -m pip install -e ".[docs]"

      - name: Build (strict — warnings fail the build)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Turns Pages on for the repository if it isn't already, and sets the
      # source to GitHub Actions. Without this the deploy fails with a bare
      # 404, which reads like a missing artifact rather than a settings
      # problem. Safe to re-run — it's a no-op once Pages is enabled.
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
