name: docs

# Builds the MkDocs site on every PR, and deploys it to GitHub Pages on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The package itself is needed: mkdocstrings imports it to generate the
        # API reference from docstrings.
        run: python -m pip install -e ".[docs]"

      - name: Build (strict — warnings fail the build)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages cannot be enabled from a workflow: GITHUB_TOKEN is refused with
      # "Resource not accessible by integration", and actions/configure-pages
      # with enablement: true fails the same way. It's a one-time manual
      # setting. This check turns that into a single actionable line instead
      # of a 404 from deploy-pages that reads like a missing artifact.
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled::Enable it at https://github.com/${GITHUB_REPOSITORY}/settings/pages — set Source to 'GitHub Actions' — then re-run this workflow. It cannot be enabled automatically: the workflow token is not permitted to create a Pages site."
            exit 1
          fi
          echo "Pages is enabled; deploying."

      - id: deployment
        uses: actions/deploy-pages@v4
