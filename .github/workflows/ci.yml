name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade ruff

      - name: ruff check
        run: ruff check --output-format=github .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: mypy
        run: mypy --strict src/localmem_mcp

  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # The full matrix is overkill for every push; keep the edges everywhere
        # and the middle versions on Linux only.
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q --cov=localmem_mcp --cov-report=term-missing

      - name: Smoke-test the installed CLI
        shell: bash
        # Asserts the database path is actually honoured, not just that the
        # command exits 0. A silently-ignored --db still exits 0, which is how
        # it went unnoticed before.
        run: |
          python -c "import localmem_mcp; print(localmem_mcp.__version__)"
          localmem-mcp --db "${RUNNER_TEMP}/smoke.db" stats | tee out.txt
          grep -q "smoke.db" out.txt
          localmem-mcp stats --db "${RUNNER_TEMP}/smoke.db" | tee out2.txt
          grep -q "smoke.db" out2.txt
          localmem-mcp --db "${RUNNER_TEMP}/smoke.db" recall

  no-network:
    name: No network calls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Not just "the suite passes" - this is the specific test that blocks
      # every outbound socket connection and proves the store's full
      # read/write/search surface works with egress cut off. See
      # tests/test_no_network.py and SECURITY.md.
      #
      # --no-cov: pytest's addopts (pyproject.toml) enable coverage with a
      # 90% gate on every invocation, but this job intentionally runs two
      # tests out of the whole suite - a coverage gate would fail here no
      # matter how well those two tests pass. Coverage is already enforced
      # by the `test` job, which runs the full suite.
      - name: Run the egress-blocked test
        run: python -m pytest -q tests/test_no_network.py -v --no-cov

  integration:
    name: Real embeddings (fastembed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run the full suite against real embeddings
        env:
          LOCALMEM_TEST_FASTEMBED: "1"
        run: python -m pytest -q --cov=localmem_mcp --cov-report=term-missing

      - name: End-to-end CLI check
        run: |
          localmem-mcp --db "${RUNNER_TEMP}/e2e.db" add "We chose SQLite over Postgres" --tag decision
          localmem-mcp --db "${RUNNER_TEMP}/e2e.db" add "My favourite drink is an oat milk latte"
          localmem-mcp --db "${RUNNER_TEMP}/e2e.db" search "what database are we using?" | tee results.txt
          grep -q SQLite results.txt

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*
