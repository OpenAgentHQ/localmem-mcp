name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade ruff

      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # The full matrix is overkill for every push; keep the edges everywhere
        # and the middle versions on Linux only.
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the MCP server starts over stdio
        shell: bash
        run: |
          python -c "import localmem_mcp; print(localmem_mcp.__version__)"
          localmem-mcp --db "${RUNNER_TEMP}/smoke.db" stats
          localmem-mcp --db "${RUNNER_TEMP}/smoke.db" recall

  integration:
    name: Real embeddings (fastembed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run the full suite against real embeddings
        env:
          LOCALMEM_TEST_FASTEMBED: "1"
        run: python -m pytest -q

      - name: End-to-end CLI check
        run: |
          localmem-mcp --db "${RUNNER_TEMP}/e2e.db" add "We chose SQLite over Postgres" --tag decision
          localmem-mcp --db "${RUNNER_TEMP}/e2e.db" add "My favourite drink is an oat milk latte"
          localmem-mcp --db "${RUNNER_TEMP}/e2e.db" search "what database are we using?" | tee results.txt
          grep -q SQLite results.txt

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*
