site_name: localmem-mcp
site_description: Local-first, zero-API memory for AI agents. Persistent, private, and yours.
site_url: https://openagenthq.github.io/localmem-mcp/
repo_url: https://github.com/OpenAgentHQ/localmem-mcp
repo_name: OpenAgentHQ/localmem-mcp
edit_uri: edit/main/docs/
copyright: MIT licensed. Your memories never leave your machine.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/brain
  favicon: assets/favicon.png
  # System fonts only. Material's default pulls Google Fonts at runtime, and a
  # site whose whole subject is "nothing leaves your machine" should not make
  # third-party requests to render its own text.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/circle-half-full
        name: Match system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Connect your client: getting-started/clients.md
  - Integrations:
      - Overview: integrations/index.md
      - Terminal agents: integrations/cli-agents.md
      - IDEs and editors: integrations/ide-agents.md
      - VS Code extensions: integrations/vscode-extensions.md
      - Desktop and custom: integrations/desktop-and-custom.md
  - Guide:
      - MCP tools: guide/mcp-tools.md
      - Command line: guide/cli.md
      - Python library: guide/python-library.md
      - Configuration: guide/configuration.md
      - How search works: guide/how-search-works.md
      - Privacy model: guide/privacy.md
  - Reference:
      - Python API: reference/api.md
      - Architecture: reference/architecture.md
      - Benchmarks: reference/benchmarks.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: google
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenAgentHQ/localmem-mcp
      name: localmem-mcp on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/localmem-mcp/
      name: localmem-mcp on PyPI

extra_css:
  - assets/extra.css

watch:
  - src/localmem_mcp
