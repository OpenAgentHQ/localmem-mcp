[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localmem-mcp"
version = "0.1.0"
description = "Local-first, zero-API memory for AI agents. Persistent, private, and yours."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OpenAgentHQ" }]
keywords = [
    "mcp",
    "memory",
    "ai-agents",
    "llm",
    "local-first",
    "privacy",
    "sqlite",
    "embeddings",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.10",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/OpenAgentHQ/localmem-mcp"
Repository = "https://github.com/OpenAgentHQ/localmem-mcp"
Issues = "https://github.com/OpenAgentHQ/localmem-mcp/issues"

[project.scripts]
localmem-mcp = "localmem_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localmem_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/localmem_mcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
