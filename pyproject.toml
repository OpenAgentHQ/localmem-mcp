[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localmem-mcp"
version = "0.1.1"
description = "Local-first, zero-API memory for AI agents. Persistent, private, and yours."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OpenAgentHQ" }]
keywords = [
    "mcp",
    "memory",
    "ai-agents",
    "llm",
    "local-first",
    "privacy",
    "sqlite",
    "embeddings",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.10",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    # MkDocs 2.0 removes the plugin system entirely, which breaks Material,
    # mkdocstrings, and every extension this site uses. Pin until there's a
    # migration path.
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://openagenthq.github.io/localmem-mcp/"
Documentation = "https://openagenthq.github.io/localmem-mcp/"
Repository = "https://github.com/OpenAgentHQ/localmem-mcp"
Issues = "https://github.com/OpenAgentHQ/localmem-mcp/issues"

[project.scripts]
localmem-mcp = "localmem_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localmem_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/localmem_mcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=localmem_mcp --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) plus E501 so the declared line-length is enforced.
select = ["E4", "E7", "E9", "F", "E501"]

[tool.mypy]
strict = true
files = ["src/localmem_mcp"]

